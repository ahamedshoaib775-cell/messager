version: '3.8'

services:
  novalink-api:
    build:
      context: ./cmd/server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - REDIS_HOST=redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: novalink-db
    environment:
      POSTGRES_DB: novalink
      POSTGRES_USER: novalink_admin
      POSTGRES_PASSWORD: supersecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: novalink-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
